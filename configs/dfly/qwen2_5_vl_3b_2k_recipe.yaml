algorithm:
  name: dfly
  # Upstream AngelSpec two-stage DFly training recipe (see docs/upstream/dfly.md):
  # stage 1 is the LK acceptance distillation with D-PACE position weighting and
  # no CE; stage 2 is D-PACE-weighted block CE + the end-to-end multi-step TV
  # term. Both stages consume the target's final hidden states as the teacher
  # signal, so the capture must be v2 (store_final_hidden=true).
  train_recipe:
    name: upstream_two_stage
    cold_start_fraction: 0.5   # share of the optimizer steps spent in stage 1
  dfly:
    # Upstream DFly recipe: the base fc + fusion residual consume the five
    # routed target layers [1, 9, 17, 25, 33] (build_target_layer_ids(36, 5)).
    context_layer_ids: [1, 9, 17, 25, 33]
    fusion_trainable: true
    fusion_init: distance
    enable_hidden_correction: true
    hidden_correction_intermediate_size: null   # null -> hidden_size
# Upstream-recipe 2K run for DFly: same data/recipe as the matched
# runs/qwen25vl3b_dfly_2k run, so the only difference is the training objective
# (shared decayed CE vs the upstream two-stage LK -> e2e-TV schedule) plus the
# upstream 5-layer context. Prepare with: data/regen symlinked to
# runs/qwen25vl3b_2k (same dataset seed), features captured here with
# drafter.capture_layer_ids below and capture.store_final_hidden=true. A
# same-identity store captured with final hidden states (e.g. the JetSpec 2K
# store, identical [1, 9, 17, 25, 33] capture) can be reused via --features.
run:
  name: qwen25vl3b_dfly_2k_recipe
  dir: runs/qwen25vl3b_dfly_2k_recipe

target:
  model: ${VLM_DFLASH_TARGET:-assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520

dataset:
  source: llava_instruct
  annotation: ${VLM_DFLASH_LLAVA_JSON:-data/llava_instruct_150k.json}
  images_dir: ${VLM_DFLASH_COCO_IMAGES:-data/coco/train2017}
  slice: 2000
  val_size: 128
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 160
  min_response_tokens: 128
  batch_size: 8
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  store_final_hidden: true   # capture v2: the recipe's teacher signal
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  capture_layer_ids: [1, 9, 17, 25, 33]   # superset also serves the matched [1, 17, 33] run
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections: [16, 24, 24]

train:
  micro_batch_size: 8
  grad_accumulation_steps: 1
  num_epochs: 6
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 10
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 16
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9

# verification: sequential (generate()-parity, default) | parallel (raw fast
# path) | strict_parallel (fast path + near-tie guard + parity fallback);
# eval.strict_parallel_margin is the top-1/top-2 logit gap threshold.
eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 128
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 16
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
