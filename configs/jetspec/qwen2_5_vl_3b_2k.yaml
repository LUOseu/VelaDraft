algorithm:
  name: jetspec
  jetspec:
    kd_temperature: 1.0   # softmax temperature T for KL(P_target || Q_draft), loss is T^2-scaled
    kd_chunk_size: 1024   # teacher-projection chunk (positions per lm_head call); bounds peak memory
# Canonical 2K scaling point for JetSpec. Same recipe/data as the DFlash /
# DSpark / Domino 2K runs, but the feature store is capture-v2
# (store_final_hidden=true) because the forward-KL teacher logits are projected
# from the target's captured final hidden states.
run:
  name: qwen25vl3b_jetspec_2k
  dir: runs/qwen25vl3b_jetspec_2k

target:
  model: ${VLM_DFLASH_TARGET:-/home/lyh/vlm-dflash/assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520

dataset:
  source: llava_instruct
  annotation: ${VLM_DFLASH_LLAVA_JSON:-/home/dhz/Data/llava_instruct_150k.json}
  images_dir: ${VLM_DFLASH_COCO_IMAGES:-/home/dhz/Data/COCO-caption/train2017}
  slice: 2000
  val_size: 128
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 160
  min_response_tokens: 128
  batch_size: 8
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  store_final_hidden: true   # capture v2: the JetSpec teacher signal
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: null   # JetSpec weights every draft position uniformly (forward KL, no depth decay)
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections: [16, 24, 24]

train:
  micro_batch_size: 8
  grad_accumulation_steps: 1
  num_epochs: 6
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 10
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    # 8 (not 16): the KD backward retains fp32 log-probabilities of every valid
    # position ([P, vocab]), so 16 samples (~28.7k positions) exceeded memory on
    # the 48G card during the sanity run; the main loop's micro-batch is 8.
    num_samples: 8
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9

# verification: sequential (generate()-parity, default) | parallel (raw fast
# path) | strict_parallel (fast path + near-tie guard + parity fallback);
# eval.strict_parallel_margin is the top-1/top-2 logit gap threshold.
eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 128
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 16
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
