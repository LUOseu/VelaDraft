algorithm: dflash  # drafter plugin; see vlm_dflash/algorithms/
# WP6 non-Qwen-family smoke: SmolVLM2-2.2B single-image rows through
# prepare -> regen -> capture -> train -> eval. Proves the SmolVLM adapter
# chain (1-D positions, tile-encoded images, reserved-row mask) end to end;
# not a quality benchmark.

run:
  name: smoke_smolvlm
  dir: runs/e6/smoke_smolvlm

target:
  model: ${VLM_DFLASH_SMOLVLM_TARGET:-assets/models/SmolVLM2-2.2B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true

dataset:
  source: jsonl
  path: ${VLM_DFLASH_E6_SOURCE:-data/e6_smoke/source.jsonl}
  jsonl_images_dir: ${VLM_DFLASH_E6_IMAGES:-data/e6_smoke/images}
  slice: 16
  val_size: 4
  seed: 42

regen:
  max_new_tokens: 64
  # The draft needs >= block_size + 1 supervised tokens per row; keep answers
  # of at least 8 tokens (SmolVLM2's answers to the smoke question run 9-19).
  min_response_tokens: 8
  batch_size: 4
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  # block_size 4 needs >= 5 supervised tokens per row, which fits SmolVLM2's
  # short-but-complete answers; block 8 would need 9+.
  block_size: 4
  num_anchors: 64
  loss_decay_gamma: 7.0
  # <|reserved_special_token_87|>: a reserved embedding row the chat template
  # can never emit (SmolVLM2 reserves ids 49191-49278; vocab 49280).
  mask_token_id: 49278
  attention_backend: flex_attention
  spatial_rope_enabled: false
  spatial_rope_mode: replace

train:
  micro_batch_size: 4
  grad_accumulation_steps: 1
  num_epochs: 8
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 4
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: false
    num_samples: 8
    steps: 120
    ce_drop: 0.6
    slot0_acc: 0.9

eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 4
  max_new_tokens: 32
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 2
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
