algorithm:
  name: dflare
  dflare:
    # Matched reduced run: context = the captured [1, 17, 33] (the shared
    # capture-v2 store), i.e. the same features the other reduced runs consume.
    # Upstream DFlare's 9-layer context is exercised by the 2K layer-rich
    # variant; the 8B store here holds only the DFlash routing.
    context_layer_ids: [1, 17, 33]
    # Upstream DFlare (AngelSpec) defaults:
    separate_context_kv: true
    fusion_trainable: true
    fusion_init: distance
# Release-validation reduced run (Qwen3-VL-8B): 256-row slice, small fixed
# training budget, 16 held-out eval prompts. Proves architecture / capture /
# training / visual-path / eval / export / reload compatibility on Qwen3-VL;
# not a quality benchmark. Symlinks (same as the other reduced runs):
#   data     -> ../qwen3vl8b_reduced_dspark/data
#   regen    -> ../qwen3vl8b_reduced_dspark/regen
#   features -> ../qwen3vl8b_reduced_dspark/features   (capture-v2, 3 layers)
# so capture is not re-run here; the store's [1, 17, 33] is exactly the
# context this config consumes.
run:
  name: qwen3vl8b_reduced_dflare
  dir: runs/qwen3vl8b_reduced_dflare

target:
  model: ${VLM_DFLASH_TARGET_QWEN3VL:-assets/models/Qwen3-VL-8B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: null
  image_max_pixels: null

dataset:
  source: llava_instruct
  annotation: ${VLM_DFLASH_LLAVA_JSON:-data/llava_instruct_150k.json}
  images_dir: ${VLM_DFLASH_COCO_IMAGES:-data/coco/train2017}
  slice: 256
  val_size: 64
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 160
  min_response_tokens: 128
  batch_size: 4
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2
  store_final_hidden: true   # shared capture-v2 store: JetSpec/DFlash2 need it

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_interleaved: true
  spatial_rope_sections: [24, 20, 20]

train:
  # 8B bf16 activations plus algorithm-specific heads (e.g. DSpark's
  # full-vocab markov bias) do not fit a 48 GB card at micro-batch 8;
  # 4 x 2 keeps the same optimizer-step budget as the other reduced runs.
  micro_batch_size: 4
  grad_accumulation_steps: 2
  num_epochs: 6
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 10
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 4
    steps: 120
    ce_drop: 0.6
    slot0_acc: 0.9

eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 16
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 16
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
