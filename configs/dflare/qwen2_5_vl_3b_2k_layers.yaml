algorithm:
  name: dflare
  dflare:
    # Layer-rich recipe on the same store: fuse all captured layers
    # [1, 9, 17, 25, 33]. Upstream DFlare fuses 9 layers of a 36-layer target
    # (build_target_layer_ids(36, 9)); this repo's 5-layer capture is the
    # affordable superset, so this run is reported as a reduced layer set.
    context_layer_ids: [1, 9, 17, 25, 33]
    separate_context_kv: true
    fusion_trainable: true
    fusion_init: distance
# Layer-rich variant of the dflare 2K run, reusing the matched run's capture
# (features symlinked to ../qwen25vl3b_dflare_2k/features) and data/regen.
# Context = all captured layers ([1, 9, 17, 25, 33]); see the matched config
# for the apples-to-apples [1, 17, 33] run.
run:
  name: qwen25vl3b_dflare_2k_layers
  dir: runs/qwen25vl3b_dflare_2k_layers

target:
  model: ${VLM_DFLASH_TARGET:-assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520

dataset:
  source: llava_instruct
  annotation: ${VLM_DFLASH_LLAVA_JSON:-data/llava_instruct_150k.json}
  images_dir: ${VLM_DFLASH_COCO_IMAGES:-data/coco/train2017}
  slice: 2000
  val_size: 128
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 160
  min_response_tokens: 128
  batch_size: 8
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  capture_layer_ids: [1, 9, 17, 25, 33]   # superset: matched [1, 17, 33] + 5-layer recipe
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections: [16, 24, 24]

train:
  micro_batch_size: 8
  grad_accumulation_steps: 1
  num_epochs: 6
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 10
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 16
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9

# verification: sequential (generate()-parity, default) | parallel (raw fast
# path) | strict_parallel (fast path + near-tie guard + parity fallback);
# eval.strict_parallel_margin is the top-1/top-2 logit gap threshold.
eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 128
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 16
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
