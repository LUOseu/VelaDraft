algorithm: dflash  # drafter plugin; see vlm_dflash/algorithms/
# WP2 multi-image / multi-turn pipeline smoke (E2): synthetic 2-image, 2-turn
# rows (generate with scripts/make_wp2_smoke_data.py) through
# prepare -> regen -> capture -> train -> eval. Proves the schema-v2 chain runs
# end to end; not a quality benchmark.

run:
  name: smoke_multiturn
  dir: runs/e2/smoke_multiturn

target:
  model: ${VLM_DFLASH_TARGET:-assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520

dataset:
  source: jsonl
  path: ${VLM_DFLASH_E2_SOURCE:-data/e2_smoke/source.jsonl}
  jsonl_images_dir: ${VLM_DFLASH_E2_IMAGES:-data/e2_smoke/images}
  slice: 16
  val_size: 4
  seed: 42

regen:
  max_new_tokens: 64
  min_response_tokens: 8
  batch_size: 8
  temperature: 0.0

capture:
  seq_length: 1024
  shard_size: 32
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 64
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections: [16, 24, 24]

train:
  micro_batch_size: 4
  grad_accumulation_steps: 1
  num_epochs: 8
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 4
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: false
    num_samples: 8
    steps: 120
    ce_drop: 0.6
    slot0_acc: 0.9

eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 4
  max_new_tokens: 32
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 2
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
