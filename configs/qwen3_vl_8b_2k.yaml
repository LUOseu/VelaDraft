# Phase-2 scaling point: same recipe as configs/qwen3_vl_8b.yaml with a
# 2000-row training slice (and 128 held-out val prompts).
# vlm-dflash v0.2 — Qwen3-VL-8B target (image-text DFlash drafter), 2K scaling point.
#
# Values marked "runtime-resolved" are validated against the downloaded
# checkpoint by the model contract; run `vlm-dflash doctor --target <dir>`
# first if you change any of them.
run:
  name: qwen3vl8b_2k
  dir: runs/qwen3vl8b_2k

target:
  model: ${VLM_DFLASH_TARGET_QWEN3VL:-/home/lyh/vlm-dflash/assets/models/Qwen3-VL-8B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  # Pixel bounds: left unset -> resolved from the target processor and recorded
  # in contract.json (Qwen3-VL processor defaults differ from Qwen2.5-VL).

dataset:
  source: llava_instruct
  annotation: ${VLM_DFLASH_LLAVA_JSON:-/home/dhz/Data/llava_instruct_150k.json}
  images_dir: ${VLM_DFLASH_COCO_IMAGES:-/home/dhz/Data/COCO-caption/train2017}
  slice: 2000
  val_size: 128
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 160
  min_response_tokens: 128
  batch_size: 4
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  # Qwen3-VL MRoPE default is [24, 20, 20]; the contract resolver validates
  # this against text_config.rope_parameters.mrope_section at runtime.
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  # Qwen3-VL uses interleaved MRoPE (mrope_interleaved=true); the contract
  # resolver validates this flag against text_config.rope_scaling.
  spatial_rope_interleaved: true
  spatial_rope_sections: [24, 20, 20]

train:
  micro_batch_size: 8
  grad_accumulation_steps: 1
  num_epochs: 6
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 10
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 16
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9

# verification: sequential (generate()-parity, default) | parallel (raw fast
# path) | strict_parallel (fast path + near-tie guard + parity fallback);
# eval.strict_parallel_margin is the top-1/top-2 logit gap threshold.
eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 128
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 16
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
