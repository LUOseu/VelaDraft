# Flagship scale run (2026-10-15): DFly upstream two-stage recipe on a 10K-slice
# corpus, ONLINE target feature source + host-RAM feature cache (the v0.3.2-dev
# optimized path). Same algorithm config as configs/dfly/qwen2_5_vl_3b_2k_recipe_matched.yaml
# (3-layer [1,17,33] routing, cold_start_fraction 0.5) so the only scale knob is
# the corpus size (10000-row slice -> ~5.3K regen-kept rows) and the step budget.
algorithm:
  name: dfly
  train_recipe:
    name: upstream_two_stage
    cold_start_fraction: 0.5   # share of the optimizer steps spent in stage 1 (LK/D-PACE)
  dfly:
    context_layer_ids: [1, 17, 33]
    fusion_trainable: true
    fusion_init: distance
    enable_hidden_correction: true
    hidden_correction_intermediate_size: null   # null -> hidden_size

run:
  name: qwen25vl3b_10k_dfly_recipe
  dir: runs/qwen25vl3b_10k_dfly_recipe

target:
  model: /home/lyh/vlm-dflash/assets/models/Qwen2.5-VL-3B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520

dataset:
  source: llava_instruct
  annotation: /home/dhz/Data/llava_instruct_150k.json
  images_dir: /home/dhz/Data/COCO-caption/train2017
  slice: 10000
  val_size: 128
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 160
  min_response_tokens: 128
  batch_size: 8
  temperature: 0.0

capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  store_final_hidden: true   # the recipe's teacher signal (v2 record)
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  capture_layer_ids: [1, 17, 33]
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections: [16, 24, 24]

train:
  feature_mode: online          # live teacher-forced extraction in the trainer process
  online_batch_size: 8          # capture group size (== micro batch)
  online_feature_cache_gb: 96   # host-RAM record cache: retain the whole corpus after epoch 1
  micro_batch_size: 8
  grad_accumulation_steps: 1
  num_epochs: 12                # ~7956 optimizer steps at ~5.3K kept rows
  save_every_steps: 663
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 1
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 16
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9

eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 128
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 16
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
