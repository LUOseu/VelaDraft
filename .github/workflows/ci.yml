name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: CPU tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU torch (tested combo)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package (tested + dev extras)
        run: pip install -e ".[tested,dev]"
      - name: CPU test suite
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest tests/ -q
      - name: NPU-readiness CPU suite (fail-closed aggregate)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python scripts/npu/run_cpu_suite.py --json runs/npu/cpu_suite.json
      - name: Documentation checks (links, paths, CLI examples, generated drift)
        run: python scripts/check_docs.py

  package:
    name: package build + fresh wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Fresh venv install of the wheel (no repo checkout on path)
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/fresh/bin/pip install dist/*.whl
      - name: Wheel ships its packaged resources
        run: |
          python - <<'PY'
          import glob, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = [
              "vlm_dflash/presets/smoke.yaml",
              "vlm_dflash/presets/single-gpu-24g.yaml",
              "vlm_dflash/presets/single-gpu-48g.yaml",
              "vlm_dflash/presets/npu-dflash-smoke.yaml",
              "vlm_dflash/presets/npu-dspark-smoke.yaml",
              "vlm_dflash/presets/npu-domino-smoke.yaml",
              "vlm_dflash/presets/npu-jetspec-smoke.yaml",
              "vlm_dflash/presets/npu-dflash2-smoke.yaml",
              "vlm_dflash/presets/npu-dflare-smoke.yaml",
              "vlm_dflash/presets/npu-dfly-smoke.yaml",
              "vlm_dflash/presets/npu-online-smoke.yaml",
              "vlm_dflash/presets/npu-split-device.yaml",
              "vlm_dflash/presets/npu-target-device-map.yaml",
              "vlm_dflash/resources/constraints-tested.txt",
          ]
          missing = [name for name in expected if name not in names]
          assert not missing, f"wheel is missing packaged resources: {missing}"
          print("wheel resources OK")
          PY
      - name: CLI smoke (repo off the path)
        run: |
          cd /tmp
          /tmp/fresh/bin/vlm-dflash --version
          /tmp/fresh/bin/vlm-dflash --help
          /tmp/fresh/bin/vlm-dflash doctor --help
          /tmp/fresh/bin/vlm-dflash demo --help
          /tmp/fresh/bin/vlm-dflash train-demo --help
          /tmp/fresh/bin/vlm-dflash train --help
          /tmp/fresh/bin/vlm-dflash eval --help
          /tmp/fresh/bin/vlm-dflash export --help
      - name: Packaged presets + constraints load from the install
        run: |
          cd /tmp
          /tmp/fresh/bin/python - <<'PY'
          import importlib.metadata as md

          from vlm_dflash import __version__
          from vlm_dflash.cli import _parse_constraints, load_preset

          assert md.version("vlm-dflash") == __version__, (md.version("vlm-dflash"), __version__)
          for name in (
              "smoke",
              "single-gpu-24g",
              "single-gpu-48g",
              "npu-dflash-smoke",
              "npu-online-smoke",
              "npu-split-device",
          ):
              cfg = load_preset(name)
              assert cfg["drafter"]["block_size"] in (4, 8), name
          npu = load_preset("npu-dflash-smoke")
          assert npu["train"]["device"].startswith("npu:"), npu["train"]["device"]
          assert npu["drafter"]["attention_backend"] == "sdpa_chunked"
          pins = _parse_constraints()
          assert pins.get("torch") and pins.get("transformers"), pins
          print("packaged resources OK:", __version__, len(pins), "pins")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
