[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-dflash"
version = "0.3.0"
description = "A unified training and evaluation stack for multimodal parallel drafters (DFlash, DSpark, Domino, JetSpec, DFlash2)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.20",
    "transformers>=5.12",
    "datasets>=3.0",
    "pyarrow",
    "pillow",
    "pyyaml",
    "numpy",
    "safetensors",
    "accelerate",
]

[project.optional-dependencies]
# Exact combination validated on the reference cluster; see constraints-tested.txt.
tested = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.12.1",
    "datasets==4.2.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
]
dev = [
    "pytest>=8",
    "build>=1.2",
]

[project.scripts]
vlm-dflash = "vlm_dflash.cli:main"

[tool.setuptools.packages.find]
include = ["vlm_dflash*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires the real target model (set VLM_DFLASH_TEST_MODEL to a local dir)",
]
addopts = "-q"

# Tested version combination (cluster, 2026-10):
#   torch==2.10.0 (cu128), transformers==5.12.1, datasets==4.2.0
