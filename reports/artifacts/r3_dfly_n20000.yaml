# R3/R5 next-round run config (2026-10-15). Frozen corpus N=20000 rows
# (regen-kept, image-grouped split seed 42; see shared/regen/freeze_record.json).
# R3 = 3 drafter layers, R5 = 5 -- identical in every other knob, including the
# target feature layers [1,17,33] and the dataset/regen blocks below, which are
# copied verbatim from the data config so the stage-digest gate accepts the
# hardlinked shared corpus. This is the round's candidate recipe, not a claim
# about an official optimum.
algorithm:
  name: dfly
  train_recipe:
    name: upstream_two_stage
    cold_start_fraction: 0.25
  dfly:
    context_layer_ids:
    - 1
    - 17
    - 33
    fusion_trainable: true
    fusion_init: distance
    enable_hidden_correction: true
    hidden_correction_intermediate_size: null
run:
  name: qwen25vl3b_dfly_r3_n20000
  dir: runs/r3r5_n20000/r3
dataset:
  source: llava_instruct
  annotation: /home/dhz/Data/llava_instruct_150k.json
  images_dir: /home/dhz/Data/COCO-caption/train2017
  slice: 24000
  val_size: 256
  test_size: 256
  seed: 42
  min_answer_chars: 0
  image_link_mode: hardlink
regen:
  max_new_tokens: 256
  min_response_tokens: 8
  batch_size: 64
  temperature: 0.0
target:
  model: /home/lyh/vlm-dflash/assets/models/Qwen2.5-VL-3B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520
capture:
  seq_length: 2048
  shard_size: 32
  dtype: bfloat16
  store_final_hidden: true
  visual_path_check: true
  visual_check_samples: 2
drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  capture_layer_ids:
  - 1
  - 17
  - 33
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections:
  - 16
  - 24
  - 24
train:
  feature_mode: online
  online_batch_size: 8
  online_feature_cache_gb: 32
  micro_batch_size: 8
  grad_accumulation_steps: 1
  num_epochs: 3
  save_every_fraction_of_epoch: 0.5
  milestone_snapshots: true
  resume_state_dir: /dev/shm/r3r5_r3/train_state
  lr: 0.0003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 1
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 4
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9
eval:
  verification: sequential
  strict_parallel_margin: 2.0
  num_prompts: 64
  max_new_tokens: 128
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 0
  checkpoints:
  - ckpt_final.pt
