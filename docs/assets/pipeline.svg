<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- stage boxes -->
  <g>
    <rect x="20" y="70" width="160" height="84" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="100" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">image-text data</text>
    <text x="100" y="122" text-anchor="middle" font-size="11" fill="#4b5563">ShareGPT jsonl + images</text>
    <text x="100" y="138" text-anchor="middle" font-size="11" fill="#4b5563">(your data or the zoo corpus)</text>
  </g>
  <line x1="182" y1="112" x2="214" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="216" y="70" width="160" height="84" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="296" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">target-native regen</text>
    <text x="296" y="122" text-anchor="middle" font-size="11" fill="#4b5563">greedy, same target</text>
    <text x="296" y="138" text-anchor="middle" font-size="11" fill="#4b5563">records provenance identity</text>
  </g>
  <line x1="378" y1="112" x2="410" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="412" y="70" width="172" height="84" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="498" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">hidden-state capture</text>
    <text x="498" y="122" text-anchor="middle" font-size="11" fill="#4b5563">staged feature store (fp16 shards</text>
    <text x="498" y="138" text-anchor="middle" font-size="11" fill="#4b5563">+ image spans + target head)</text>
  </g>
  <line x1="586" y1="112" x2="618" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="620" y="70" width="160" height="84" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="700" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">drafter training</text>
    <text x="700" y="122" text-anchor="middle" font-size="11" fill="#1e40af">block-parallel CE, offline</text>
    <text x="700" y="138" text-anchor="middle" font-size="11" fill="#1e40af">target unloaded from GPU</text>
  </g>
  <line x1="782" y1="112" x2="814" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="816" y="70" width="144" height="84" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="888" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">eval + export</text>
    <text x="888" y="122" text-anchor="middle" font-size="11" fill="#4b5563">token-exact gate,</text>
    <text x="888" y="138" text-anchor="middle" font-size="11" fill="#4b5563">AL + per-slot acceptance</text>
  </g>

  <!-- annotations -->
  <g font-size="11" fill="#6b7280">
    <text x="296" y="52" text-anchor="middle">one GPU pass, batched, greedy</text>
    <text x="700" y="52" text-anchor="middle">no target weights needed here</text>
    <text x="498" y="196" text-anchor="middle">reusable: train DFlash / DSpark / Domino / JetSpec / DFlash2 from one capture</text>
    <text x="972" y="196" text-anchor="end">speculative output must match</text>
    <text x="972" y="212" text-anchor="end">the target's greedy tokens exactly</text>
  </g>
</svg>
