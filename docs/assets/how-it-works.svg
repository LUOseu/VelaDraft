<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="800" viewBox="0 0 1560 800" role="img" aria-labelledby="title desc">
<title id="title">VelaDraft pipeline: reusable visual context, offline or online drafter training, validation and export</title>
<desc id="desc">Image-text data is used by the target VLM to generate responses and capture hidden states. Compatible captured features can be reused to train DFlash, DSpark, Domino, JetSpec, DFlash2, DFlare or DFly. Training runs offline from the store, or online against the live frozen target; the target is reloaded for evaluation. Checkpoint export follows validation.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8795A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="mintArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="offset"/><feFlood flood-color="#12263A" flood-opacity=".04" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/><feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
