<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="800" viewBox="0 0 1560 800" role="img" aria-labelledby="title desc">
<title id="title">VelaDraft pipeline: prepare and capture, train offline from the feature store or online against the live frozen target, validate token-exactly, export</title>
<desc id="desc">Image-text data goes through target-native regen and hidden-state capture to a reusable feature store. Training reads either that store (offline, target off the GPU) or a live frozen target (online, target resident; optional host-RAM record cache). One of seven drafter algorithms trains in each run. Validation compares the verified speculative output against target-only greedy decoding (token-exact), then the checkpoint is exported.</desc>
