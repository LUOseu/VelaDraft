<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
<title id="title">VelaDraft: one workflow, measurable training systems</title>
<desc id="desc">Three stages connect data and target features, drafter training, and evaluation with export. Below the workflow, a systems loop profiles extraction and scoring, optimizes reuse and wasted work, and validates numerical and resource trade-offs. Optimization settings and validation coverage are documented separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#78918f" stroke-width="1.5"/></marker></defs>
<rect width="1320" height="620" rx="24" fill="#f7faf9"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="49" font-size="14" font-weight="700" letter-spacing="2.2" fill="#087e74">VELADRAFT / OVERVIEW</text>
<text x="48" y="97" font-size="34" font-weight="700" fill="#142c38">One workflow. Measurable training systems.</text>
<text x="48" y="129" font-size="18" fill="#596e77">Shared infrastructure for multimodal parallel block drafters</text>
