algorithm: dflash  # drafter plugin; see vlm_dflash/algorithms/
# 24 GB single-GPU preset: lowered micro-batch / sequence length / image budget
# and half the dataset slice. NOT hardware-tested in the v0.1/v0.2 development
# environment (48 GB card); treat as a starting point, check `vlm-dflash doctor`.
target:
  model: ${VLM_DFLASH_TARGET:-assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 501760

dataset:
  slice: 256
  val_size: 32
  seed: 42
  min_answer_chars: 600

regen:
  max_new_tokens: 128
  min_response_tokens: 96
  batch_size: 4
  temperature: 0.0

capture:
  seq_length: 1536
  shard_size: 16
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 128
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace

train:
  # Target-feature source: offline (pre-captured feature store) | online
  # (live target extraction during training; see docs/online-training.md).
  feature_mode: offline
  micro_batch_size: 2
  grad_accumulation_steps: 2
  num_epochs: 6
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 10
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 8
    steps: 200
    ce_drop: 0.6
    slot0_acc: 0.9

eval:
  num_prompts: 32
  max_new_tokens: 96
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 8
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
