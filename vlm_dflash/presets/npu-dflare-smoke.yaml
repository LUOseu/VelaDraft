algorithm:
  name: dflare
  dflare:
    fusion_init: distance
run:
  name: npu-dflare-smoke
  dir: runs/npu/dflare-smoke
target:
  model: ${VLM_DFLASH_TARGET:-assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: npu:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 501760
dataset:
  source: jsonl
  path: ${VLM_DFLASH_NPU_DATA:-data/npu_smoke.jsonl}
  jsonl_images_dir: ${VLM_DFLASH_NPU_IMAGES:-data/npu_smoke/images}
  slice: 16
  val_size: 4
  seed: 42
regen:
  max_new_tokens: 48
  min_response_tokens: 8
  batch_size: 1
  temperature: 0.0
capture:
  seq_length: 1024
  shard_size: 4
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 1
drafter:
  num_hidden_layers: 2
  intermediate_size: 1024
  block_size: 4
  num_anchors: 8
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: sdpa_chunked
  attention_chunk_size: 32
  spatial_rope_enabled: true
  spatial_rope_mode: replace
train:
  feature_mode: offline
  micro_batch_size: 1
  grad_accumulation_steps: 1
  num_epochs: 1
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.1
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 1
  seed: 42
  device: npu:0
  draft_dtype: bfloat16
  pin_memory: false
  non_blocking: false
  overfit_sanity:
    enabled: false
eval:
  num_prompts: 4
  max_new_tokens: 16
  sequential_target_verification: true
  verify_sdpa_backend: parity
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
