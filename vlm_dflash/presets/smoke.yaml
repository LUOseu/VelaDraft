algorithm: dflash  # drafter plugin; see vlm_dflash/algorithms/
# Pipeline smoke preset: COCO captions (short answers), tiny slice, short
# training. Proves the full chain runs; not a quality benchmark.
run:
  name: smoke_coco
  dir: runs/smoke_coco

target:
  model: ${VLM_DFLASH_TARGET:-assets/models/Qwen2.5-VL-3B-Instruct}
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:0
  local_files_only: true
  image_min_pixels: 200704
  image_max_pixels: 1003520

dataset:
  source: coco_caption
  annotation: ${VLM_DFLASH_COCO_CAPTIONS:-data/coco/annotations/captions_train2017.json}
  images_dir: ${VLM_DFLASH_COCO_IMAGES:-data/coco/train2017}
  slice: 64
  val_size: 8
  seed: 42
  min_answer_chars: 0
  smoke_question: "Please describe this image in detail."

regen:
  max_new_tokens: 48
  min_response_tokens: 6
  batch_size: 8
  temperature: 0.0

capture:
  seq_length: 1024
  shard_size: 16
  dtype: bfloat16
  visual_path_check: true
  visual_check_samples: 2

drafter:
  num_hidden_layers: 3
  block_size: 8
  num_anchors: 64
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention
  spatial_rope_enabled: true
  spatial_rope_mode: replace

train:
  # Target-feature source: offline (pre-captured feature store) | online
  # (live target extraction during training; see docs/online-training.md).
  feature_mode: offline
  micro_batch_size: 4
  grad_accumulation_steps: 1
  num_epochs: 3
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  log_every_steps: 5
  seed: 42
  device: cuda:0
  overfit_sanity:
    enabled: true
    num_samples: 8
    steps: 400
    ce_drop: 0.6
    slot0_acc: 0.9

eval:
  num_prompts: 8
  max_new_tokens: 32
  sequential_target_verification: true
  verify_sdpa_backend: parity
  parallel_diagnostic_prompts: 8
  checkpoints: [ckpt_final.pt, ckpt_init.pt]
